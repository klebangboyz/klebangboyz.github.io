name: Update Facebook Feed

on:
  schedule:
    # Automatically check and pull new posts every 15 minutes
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'config.json'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and filter Facebook posts strictly by config.json hashtags
        run: node scripts/fetch-feed.js

      - name: Build production bundle into dist/
        run: node scripts/build.js

      - name: Commit and push updated feed and dist if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/feed.json dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Facebook feed strictly by config.json hashtags" && git push)

