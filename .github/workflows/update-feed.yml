name: Update Facebook Feed

on:
  push:
    paths:
      - 'config.json'
  workflow_dispatch: # Allows manual or external API trigger (POST /actions/workflows/update-feed.yml/dispatches)
  repository_dispatch: # Allows external cron/webhook trigger (POST /dispatches)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and filter Facebook posts strictly by config.json hashtags
        run: node scripts/fetch-feed.js

      - name: Build production bundle into dist/
        run: node scripts/build.js

      - name: Commit and push updated feed and dist if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/feed.json dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Facebook feed strictly by config.json hashtags" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

